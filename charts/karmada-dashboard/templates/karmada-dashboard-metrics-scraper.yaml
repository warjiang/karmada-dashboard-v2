{{- $name := include "karmada-dashboard.name" . -}}
{{- $prometheusMode := .Values.metrics_scraper.prometheus.mode -}}
{{- if not (has $prometheusMode (list "managed" "external")) -}}
{{- fail "metrics_scraper.prometheus.mode must be managed or external" -}}
{{- end -}}
{{- $enabledComponents := list -}}
{{- range $componentName, $component := .Values.metrics_scraper.components -}}
{{- if $component.enabled -}}
{{- $enabledComponents = append $enabledComponents $componentName -}}
{{- end -}}
{{- end -}}
{{- $prometheusURL := printf "http://%s-prometheus:9090" $name -}}
{{- if eq $prometheusMode "external" -}}
{{- $prometheusURL = required "metrics_scraper.prometheus.external.url is required in external mode" .Values.metrics_scraper.prometheus.external.url -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-metrics-scraper
  namespace: {{ include "karmada-dashboard.namespace" . }}
  labels:
    {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 6 }}
  replicas: {{ .Values.metrics_scraper.replicaCount }}
  {{- with .Values.metrics_scraper.strategy }}
  strategy:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.metrics_scraper.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 8 }}
        {{- with .Values.metrics_scraper.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: karmada-dashboard
      {{- include "karmada-dashboard.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.metrics_scraper.podSecurityContext | nindent 8 }}
      containers:
        - name: metrics-scraper
          securityContext:
            {{- toYaml .Values.metrics_scraper.securityContext | nindent 12 }}
          image: {{ template "karmada-dashboard.metrics-scraper.image" . }}
          imagePullPolicy: {{ .Values.metrics_scraper.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.metrics_scraper.service.port }}
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 15
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8000
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.metrics_scraper.resources | nindent 12 }}
          volumeMounts:
            - name: kubeconfig-secret
              subPath: kubeconfig
              mountPath: /etc/kubeconfig
            {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.bearerTokenSecret.name }}
            - name: prometheus-bearer-token
              subPath: {{ .Values.metrics_scraper.prometheus.external.bearerTokenSecret.key }}
              mountPath: /etc/prometheus-external/token
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.tlsSecret.name }}
            - name: prometheus-tls
              mountPath: /etc/prometheus-external/tls
              readOnly: true
            {{- end }}
          command:
            - karmada-dashboard-metrics-scraper
            - --kubeconfig=/etc/kubeconfig
            - --context={{ .Values.metrics_scraper.kubeconfigContext }}
            - --insecure-bind-address=0.0.0.0
            - --bind-address=0.0.0.0
            - --namespace={{ include "karmada-dashboard.namespace" . }}
            - --prometheus-url={{ $prometheusURL }}
            - --prometheus-query-timeout={{ .Values.metrics_scraper.prometheus.queryTimeout }}
            - --prometheus-max-query-range={{ .Values.metrics_scraper.prometheus.maxQueryRange }}
            - --metrics-components={{ join "," $enabledComponents }}
            {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.bearerTokenSecret.name }}
            - --prometheus-bearer-token-file=/etc/prometheus-external/token
            {{- end }}
            {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.tlsSecret.name }}
            {{- if .Values.metrics_scraper.prometheus.external.tlsSecret.caKey }}
            - --prometheus-ca-file=/etc/prometheus-external/tls/{{ .Values.metrics_scraper.prometheus.external.tlsSecret.caKey }}
            {{- end }}
            {{- if .Values.metrics_scraper.prometheus.external.tlsSecret.certKey }}
            - --prometheus-client-cert-file=/etc/prometheus-external/tls/{{ .Values.metrics_scraper.prometheus.external.tlsSecret.certKey }}
            - --prometheus-client-key-file=/etc/prometheus-external/tls/{{ required "metrics_scraper.prometheus.external.tlsSecret.keyKey is required with certKey" .Values.metrics_scraper.prometheus.external.tlsSecret.keyKey }}
            {{- else if .Values.metrics_scraper.prometheus.external.tlsSecret.keyKey }}
            {{- fail "metrics_scraper.prometheus.external.tlsSecret.certKey is required with keyKey" }}
            {{- end }}
            {{- end }}
            {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.serverName }}
            - --prometheus-server-name={{ .Values.metrics_scraper.prometheus.external.serverName }}
            {{- end }}
            {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.insecureSkipVerify }}
            - --prometheus-insecure-tls=true
            {{- end }}
      volumes:
        - name: kubeconfig-secret
          secret:
            secretName: {{ .Values.metrics_scraper.kubeconfigName }}
        {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.bearerTokenSecret.name }}
        - name: prometheus-bearer-token
          secret:
            secretName: {{ .Values.metrics_scraper.prometheus.external.bearerTokenSecret.name }}
        {{- end }}
        {{- if and (eq .Values.metrics_scraper.prometheus.mode "external") .Values.metrics_scraper.prometheus.external.tlsSecret.name }}
        - name: prometheus-tls
          secret:
            secretName: {{ .Values.metrics_scraper.prometheus.external.tlsSecret.name }}
        {{- end }}
      {{- with .Values.metrics_scraper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics_scraper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics_scraper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{ if .Values.metrics_scraper.podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-metrics-scraper
  namespace: {{ include "karmada-dashboard.namespace" . }}
  labels:
    {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 6 }}
  {{ toYaml .Values.metrics_scraper.podDisruptionBudget | nindent 2 }}
{{- end -}}
