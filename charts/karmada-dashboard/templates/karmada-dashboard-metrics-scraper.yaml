{{- $name := include "karmada-dashboard.name" . -}}
{{- if ne (int .Values.metrics_scraper.replicaCount) 1 -}}
{{- fail "metrics_scraper.replicaCount must be 1 because metrics collection and sync switches are process-local" -}}
{{- end -}}
{{- $vmURL := printf "http://%s-victoria-metrics:%v" $name .Values.victoria_metrics.service.port -}}
{{- if not .Values.victoria_metrics.enabled -}}
{{- $vmURL = required "victoria_metrics.externalURL is required when victoria_metrics.enabled=false" .Values.victoria_metrics.externalURL -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-metrics-scraper
  namespace: {{ include "karmada-dashboard.namespace" . }}
  labels:
    {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 6 }}
  replicas: {{ .Values.metrics_scraper.replicaCount }}
  {{- with .Values.metrics_scraper.strategy }}
  strategy:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.metrics_scraper.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 8 }}
        {{- with .Values.metrics_scraper.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: karmada-dashboard
      {{- include "karmada-dashboard.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.metrics_scraper.podSecurityContext | nindent 8 }}
      containers:
        - name: metrics-scraper
          securityContext:
            {{- toYaml .Values.metrics_scraper.securityContext | nindent 12 }}
          image: {{ template "karmada-dashboard.metrics-scraper.image" . }}
          imagePullPolicy: {{ .Values.metrics_scraper.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.metrics_scraper.service.port }}
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 15
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8000
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.metrics_scraper.resources | nindent 12 }}
          volumeMounts:
            - name: kubeconfig-secret
              subPath: kubeconfig
              mountPath: /etc/kubeconfig
            {{- if .Values.victoria_metrics.auth.bearerTokenSecretName }}
            - name: victoria-metrics-token
              mountPath: /var/run/secrets/victoria-metrics/token
              subPath: token
              readOnly: true
            {{- end }}
            {{- if .Values.victoria_metrics.auth.caSecretName }}
            - name: victoria-metrics-ca
              mountPath: /var/run/secrets/victoria-metrics/ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
          command:
            - karmada-dashboard-metrics-scraper
            - --karmada-kubeconfig=/etc/kubeconfig
            - --karmada-context={{ .Values.metrics_scraper.kubeconfigContext }}
            - --kubeconfig=/etc/kubeconfig
            - --context={{ .Values.metrics_scraper.kubeconfigContext }}
            - --insecure-bind-address=0.0.0.0
            - --bind-address=0.0.0.0
            - --victoria-metrics-url={{ $vmURL }}
            - --victoria-metrics-timeout={{ .Values.victoria_metrics.requestTimeout }}
            {{- if .Values.victoria_metrics.auth.bearerTokenSecretName }}
            - --victoria-metrics-bearer-token-file=/var/run/secrets/victoria-metrics/token
            {{- end }}
            {{- if .Values.victoria_metrics.auth.caSecretName }}
            - --victoria-metrics-ca-file=/var/run/secrets/victoria-metrics/ca.crt
            {{- end }}
            {{- if .Values.victoria_metrics.auth.insecureSkipVerify }}
            - --victoria-metrics-insecure-skip-verify=true
            {{- end }}
      volumes:
        - name: kubeconfig-secret
          secret:
            secretName: {{ .Values.metrics_scraper.kubeconfigName }}
        {{- if .Values.victoria_metrics.auth.bearerTokenSecretName }}
        - name: victoria-metrics-token
          secret:
            secretName: {{ .Values.victoria_metrics.auth.bearerTokenSecretName }}
            items:
              - key: {{ .Values.victoria_metrics.auth.bearerTokenSecretKey }}
                path: token
        {{- end }}
        {{- if .Values.victoria_metrics.auth.caSecretName }}
        - name: victoria-metrics-ca
          secret:
            secretName: {{ .Values.victoria_metrics.auth.caSecretName }}
            items:
              - key: {{ .Values.victoria_metrics.auth.caSecretKey }}
                path: ca.crt
        {{- end }}
      {{- with .Values.metrics_scraper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics_scraper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics_scraper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{ if .Values.metrics_scraper.podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-metrics-scraper
  namespace: {{ include "karmada-dashboard.namespace" . }}
  labels:
    {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "karmada-dashboard.metrics-scraper.labels" . | nindent 6 }}
  {{ toYaml .Values.metrics_scraper.podDisruptionBudget | nindent 2 }}
{{- end -}}
